<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Setup -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <title>FitTrack</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; position: relative; padding-bottom: 70px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .ring-progress { transition: stroke-dashoffset 0.5s ease-in-out; }
        input[type="text"], input[type="number"], select { font-size: 16px !important; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
</head>
<body class="text-gray-800 antialiased">

<div class="app-container">
    
    <!-- Redesigned Top Header -->
    <header class="bg-blue-600 text-white pt-4 pb-2 px-4 sticky top-0 z-10 shadow-sm">
        <div class="flex justify-between items-center mb-3">
            <h1 class="text-xl font-bold flex items-center tracking-tight">
                <i class="fas fa-leaf mr-2"></i> FitTrack
            </h1>
            <div class="cursor-pointer" onclick="switchTab('progress')">
                <i class="fas fa-user-circle text-[28px]"></i>
            </div>
        </div>
        
        <div class="border-t border-blue-400 pt-2 mb-1">
            <div id="dateNavigator" class="flex justify-between items-center">
                <button onclick="changeDate(-1)" class="p-2 -ml-2 text-white/90 hover:text-white"><i class="fas fa-chevron-left text-sm"></i></button>
                <span id="currentDateDisplay" class="font-medium text-[15px]">Today</span>
                <button onclick="changeDate(1)" class="p-2 -mr-2 text-white/90 hover:text-white"><i class="fas fa-chevron-right text-sm"></i></button>
            </div>
        </div>
    </header>

    <!-- VIEWS -->
    <main id="mainContent">
        
        <!-- TAB 1: DIARY & DASHBOARD -->
        <div id="view-diary" class="block">
            
            <!-- Redesigned Dashboard -->
            <div class="bg-white p-5 border-b border-gray-200">
                <h2 class="text-[11px] font-bold text-gray-400 tracking-wider mb-4 uppercase">Calories Remaining</h2>
                
                <div class="flex justify-between items-center mb-6 px-1">
                    <!-- Left Side: Math logic -->
                    <div class="flex items-start space-x-6">
                        <div class="text-center">
                            <div id="goalDisplay" class="text-[28px] font-bold text-gray-800 leading-none">2000</div>
                            <div class="text-[11px] text-gray-500 mt-1">Goal</div>
                        </div>
                        <div class="text-gray-300 font-bold text-xl mt-1">-</div>
                        <div class="text-center">
                            <div id="foodDisplay" class="text-[28px] font-bold text-blue-600 leading-none">0</div>
                            <div class="text-[11px] text-gray-500 mt-1">Food</div>
                        </div>
                    </div>

                    <!-- Right Side: Green Ring -->
                    <div class="relative w-[100px] h-[100px] shrink-0">
                        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="40" stroke="#f3f4f6" stroke-width="8" fill="none" />
                            <circle id="calRing" cx="50" cy="50" r="40" stroke="#22c55e" stroke-width="8" fill="none" stroke-dasharray="251.2" stroke-dashoffset="0" class="ring-progress" stroke-linecap="round" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                            <span id="calRemaining" class="text-2xl font-bold text-gray-800 leading-tight">2000</span>
                            <span class="text-[10px] text-gray-500 uppercase">Remaining</span>
                        </div>
                    </div>
                </div>

                <hr class="border-gray-100 mb-4 mt-2">

                <!-- Macro Bars -->
                <div class="flex space-x-5 px-1">
                    <div class="flex-1">
                        <div class="flex justify-between items-end mb-1.5">
                            <span class="text-gray-700 font-medium text-[13px]">Carbs</span>
                            <span id="carbsText" class="text-gray-500 text-[11px]">0/250g</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div id="carbsBar" class="bg-emerald-400 h-1.5 rounded-full" style="width: 0%"></div></div>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-end mb-1.5">
                            <span class="text-gray-700 font-medium text-[13px]">Protein</span>
                            <span id="proText" class="text-gray-500 text-[11px]">0/150g</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div id="proBar" class="bg-purple-500 h-1.5 rounded-full" style="width: 0%"></div></div>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-end mb-1.5">
                            <span class="text-gray-700 font-medium text-[13px]">Fat</span>
                            <span id="fatText" class="text-gray-500 text-[11px]">0/65g</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div id="fatBar" class="bg-yellow-400 h-1.5 rounded-full" style="width: 0%"></div></div>
                    </div>
                </div>
            </div>

            <!-- Diary Sections -->
            <div id="diarySections" class="p-4 space-y-4">
                <!-- Dynamically populated by JS -->
            </div>
        </div>

        <!-- TAB 2: PROGRESS & GOALS -->
        <div id="view-progress" class="hidden p-4">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Your Progress</h2>
            
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm mb-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-gray-700">Calorie History</h3>
                    <select id="chartTimeframe" onchange="updateChart()" class="text-sm bg-gray-50 border border-gray-200 rounded px-2 py-1">
                        <option value="7">Last 7 Days</option>
                        <option value="14">Last 14 Days</option>
                    </select>
                </div>
                <div class="relative h-[250px] w-full">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>

            <h2 class="text-lg font-bold mb-4 text-gray-800 mt-8">Settings & Goals</h2>
            <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Daily Calorie Goal</label>
                    <input type="number" id="profileCalories" class="w-full px-3 py-2 border border-gray-300 rounded-lg" onchange="updateGoals()">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Carbs (g)</label>
                        <input type="number" id="profileCarbs" class="w-full px-3 py-2 border border-gray-300 rounded-lg" onchange="updateGoals()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Protein (g)</label>
                        <input type="number" id="profileProtein" class="w-full px-3 py-2 border border-gray-300 rounded-lg" onchange="updateGoals()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fat (g)</label>
                        <input type="number" id="profileFat" class="w-full px-3 py-2 border border-gray-300 rounded-lg" onchange="updateGoals()">
                    </div>
                </div>

                <hr class="my-4">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gemini AI API Key (For Photos)</label>
                    <input type="password" id="profileApiKey" placeholder="Paste API key here" class="w-full px-3 py-2 border border-gray-300 rounded-lg" onchange="saveApiKey()">
                    <p class="text-xs text-gray-500 mt-1">Saved locally on your device to enable AI scanning.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full max-w-[480px] bg-white border-t border-gray-200 flex justify-around items-center pb-safe">
        <button onclick="switchTab('diary')" id="nav-diary" class="flex-1 py-3 text-blue-600 flex flex-col items-center">
            <i class="fas fa-book mb-1 text-lg"></i>
            <span class="text-[10px] font-medium uppercase">Diary</span>
        </button>
        <button onclick="switchTab('progress')" id="nav-progress" class="flex-1 py-3 text-gray-400 hover:text-blue-600 flex flex-col items-center">
            <i class="fas fa-chart-line mb-1 text-lg"></i>
            <span class="text-[10px] font-medium uppercase">Progress</span>
        </button>
    </nav>

</div>

<!-- Modal Overlay -->
<div id="modalOverlay" class="fixed inset-0 bg-black/50 z-40 hidden" onclick="closeModal()"></div>

<!-- Add/Edit Modal -->
<div id="addModal" class="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-[480px] bg-white rounded-t-2xl z-50 transition-transform translate-y-full duration-300 ease-in-out max-h-[90vh] overflow-y-auto pb-safe">
    <div class="p-5">
        <div class="flex justify-between items-center mb-4">
            <h2 id="modalTitle" class="text-lg font-bold text-gray-800">Add Food</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-2"><i class="fas fa-times text-xl"></i></button>
        </div>

        <div id="searchScanTools">
            <!-- Gallery Upload AI -->
            <div class="mb-4">
                <label for="imageUpload" class="w-full bg-purple-600 text-white py-3 rounded-xl font-medium hover:bg-purple-700 transition flex items-center justify-center cursor-pointer shadow-sm">
                    <i class="fas fa-image mr-2"></i> Select Photo from Gallery (AI)
                </label>
                <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="analyzePhoto(event)">
                <div id="aiLoading" class="hidden text-center text-sm text-purple-600 mt-2 font-medium">
                    <i class="fas fa-spinner fa-spin mr-1"></i> Analyzing food...
                </div>
            </div>

            <!-- Search Database -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Search Food Database</label>
                <form id="searchForm" onsubmit="searchDatabase(event)" class="flex space-x-2">
                    <input type="text" id="searchInput" placeholder="e.g., Banana, Chicken Breast" class="flex-grow px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="bg-blue-100 text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-200 transition">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <div id="searchResults" class="mt-2 max-h-40 overflow-y-auto bg-white border border-gray-200 rounded-lg hidden shadow-sm divide-y divide-gray-100"></div>
            </div>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-medium uppercase">Or enter manually</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>
        </div>

        <form id="addForm" onsubmit="saveEntry(event)">
            <input type="hidden" id="entryCategory" value="Breakfast">
            
            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input type="text" id="entryName" required placeholder="e.g., Banana" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
                    <input type="number" id="entryQuantity" required min="0.01" step="0.01" value="1" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                    <select id="entryUnit" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="serving">Serving</option>
                        <option value="g">Grams (g)</option>
                        <option value="oz">Ounces (oz)</option>
                        <option value="ml">Milliliters (ml)</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-medium text-gray-700 mb-1">Total Calories</label>
                <input type="number" id="entryCalories" required min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-blue-50 font-bold text-blue-800">
            </div>

            <div class="grid grid-cols-3 gap-3 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Carbs (g)</label>
                    <input type="number" id="entryCarbs" required min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Protein (g)</label>
                    <input type="number" id="entryProtein" required min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fat (g)</label>
                    <input type="number" id="entryFat" required min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="flex space-x-3">
                <button type="button" id="deleteEntryBtn" onclick="deleteCurrentEntry()" class="hidden bg-red-100 text-red-600 px-4 py-3 rounded-xl font-medium hover:bg-red-200 transition">
                    <i class="fas fa-trash"></i>
                </button>
                <button type="submit" class="flex-grow bg-blue-600 text-white py-3 rounded-xl font-bold text-lg hover:bg-blue-700 transition shadow-md">
                    <i class="fas fa-check mr-2"></i> Save Entry
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // --- State & Core Setup ---
    const getTodayString = () => new Date().toISOString().split('T')[0];
    
    function generateMockHistory() {
        let history = [];
        let date = new Date();
        for(let i=1; i<=14; i++) {
            date.setDate(date.getDate() - 1);
            history.push({
                id: 100+i, type: 'food', category: 'Dinner', name: 'Historical Meal', quantity: 1, unit: 'serving', servingWeightGrams: 100,
                calories: Math.floor(Math.random() * 600) + 1600, carbs: 180, protein: 110, fat: 50,
                date: date.toISOString().split('T')[0]
            });
        }
        return history;
    }

    let STATE = {
        goal: 2000,
        macroTargets: { carbs: 250, protein: 150, fat: 65 }, // in grams
        currentDate: getTodayString(),
        entries: [
            { id: 1, type: 'food', category: 'Breakfast', name: 'Oatmeal & Berries', quantity: 1, unit: 'serving', servingWeightGrams: 100, calories: 320, carbs: 55, protein: 10, fat: 5, date: getTodayString() },
            { id: 2, type: 'food', category: 'Lunch', name: 'Chicken Salad', quantity: 1, unit: 'serving', servingWeightGrams: 100, calories: 450, carbs: 20, protein: 45, fat: 18, date: getTodayString() },
            ...generateMockHistory()
        ],
        apiKey: localStorage.getItem('geminiApiKey') || ''
    };

    const categories = ['Breakfast', 'Lunch', 'Dinner', 'Snacks'];
    let progressChart = null;
    let editingEntryId = null;
    
    // Engine for handling units per gram securely
    let foodContext = {
        calPerGram: 0, carbPerGram: 0, proPerGram: 0, fatPerGram: 0, servingWeightGrams: 100 
    };

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('profileApiKey').value = STATE.apiKey;
        document.getElementById('profileCalories').value = STATE.goal;
        document.getElementById('profileCarbs').value = STATE.macroTargets.carbs;
        document.getElementById('profileProtein').value = STATE.macroTargets.protein;
        document.getElementById('profileFat').value = STATE.macroTargets.fat;
        
        document.getElementById('entryQuantity').addEventListener('input', calculateMacrosFromContext);
        document.getElementById('entryUnit').addEventListener('change', calculateMacrosFromContext);
        document.getElementById('entryCalories').addEventListener('input', updateContextFromInputs);
        document.getElementById('entryCarbs').addEventListener('input', updateContextFromInputs);
        document.getElementById('entryProtein').addEventListener('input', updateContextFromInputs);
        document.getElementById('entryFat').addEventListener('input', updateContextFromInputs);

        updateDashboard();
        renderDiary();
        initChart();
    });

    // --- Dynamic Quantity & Unit Math Engine ---
    function getMultiplier() {
        const qty = parseFloat(document.getElementById('entryQuantity').value) || 0;
        const unit = document.getElementById('entryUnit').value;
        let multiplier = 1;
        if (unit === 'oz') multiplier = 28.3495;
        else if (unit === 'serving') multiplier = foodContext.servingWeightGrams || 100;
        return multiplier * qty;
    }

    function calculateMacrosFromContext() {
        const totalGrams = getMultiplier();
        if (totalGrams >= 0) {
            document.getElementById('entryCalories').value = Math.round(foodContext.calPerGram * totalGrams);
            document.getElementById('entryCarbs').value = Math.round(foodContext.carbPerGram * totalGrams);
            document.getElementById('entryProtein').value = Math.round(foodContext.proPerGram * totalGrams);
            document.getElementById('entryFat').value = Math.round(foodContext.fatPerGram * totalGrams);
        }
    }

    function updateContextFromInputs() {
        const totalGrams = getMultiplier();
        if (totalGrams > 0) {
            foodContext.calPerGram = (parseFloat(document.getElementById('entryCalories').value) || 0) / totalGrams;
            foodContext.carbPerGram = (parseFloat(document.getElementById('entryCarbs').value) || 0) / totalGrams;
            foodContext.proPerGram = (parseFloat(document.getElementById('entryProtein').value) || 0) / totalGrams;
            foodContext.fatPerGram = (parseFloat(document.getElementById('entryFat').value) || 0) / totalGrams;
        }
    }

    function switchTab(tabId) {
        document.getElementById('view-diary').classList.add('hidden');
        document.getElementById('view-progress').classList.add('hidden');
        document.getElementById('nav-diary').classList.replace('text-blue-600', 'text-gray-400');
        document.getElementById('nav-progress').classList.replace('text-blue-600', 'text-gray-400');

        document.getElementById(`view-${tabId}`).classList.remove('hidden');
        document.getElementById(`nav-${tabId}`).classList.replace('text-gray-400', 'text-blue-600');
        
        if(tabId === 'progress') updateChart();
        window.scrollTo(0, 0);
    }

    function changeDate(offset) {
        let dateObj = new Date(STATE.currentDate + 'T00:00:00');
        dateObj.setDate(dateObj.getDate() + offset);
        
        const todayStr = getTodayString();
        const newDateStr = dateObj.toISOString().split('T')[0];
        if (newDateStr > todayStr) return;
        
        STATE.currentDate = newDateStr;
        if (newDateStr === todayStr) {
            document.getElementById('currentDateDisplay').textContent = "Today";
        } else {
            document.getElementById('currentDateDisplay').textContent = dateObj.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        }
        
        updateDashboard();
        renderDiary();
    }

    function updateDashboard() {
        const dailyEntries = STATE.entries.filter(e => e.date === STATE.currentDate);
        let consumedCals = 0, consumedCarbs = 0, consumedPro = 0, consumedFat = 0;
        
        dailyEntries.forEach(entry => {
            consumedCals += entry.calories || 0;
            consumedCarbs += entry.carbs || 0;
            consumedPro += entry.protein || 0;
            consumedFat += entry.fat || 0;
        });

        const remaining = STATE.goal - consumedCals;
        
        // Update specific redesigned text IDs
        document.getElementById('goalDisplay').textContent = STATE.goal;
        document.getElementById('foodDisplay').textContent = consumedCals;
        
        document.getElementById('calRemaining').textContent = Math.abs(remaining);
        document.getElementById('calRemaining').nextElementSibling.textContent = remaining < 0 ? "Over Goal" : "Remaining";
        
        const ring = document.getElementById('calRing');
        const circumference = 251.2;
        let percentCals = Math.min(consumedCals / STATE.goal, 1);
        ring.style.strokeDashoffset = circumference - (percentCals * circumference);
        ring.style.stroke = remaining < 0 ? '#ef4444' : '#22c55e'; // Green for normal

        document.getElementById('carbsText').textContent = `${consumedCarbs}/${STATE.macroTargets.carbs}g`;
        document.getElementById('proText').textContent = `${consumedPro}/${STATE.macroTargets.protein}g`;
        document.getElementById('fatText').textContent = `${consumedFat}/${STATE.macroTargets.fat}g`;

        document.getElementById('carbsBar').style.width = `${Math.min((consumedCarbs / STATE.macroTargets.carbs) * 100, 100)}%`;
        document.getElementById('proBar').style.width = `${Math.min((consumedPro / STATE.macroTargets.protein) * 100, 100)}%`;
        document.getElementById('fatBar').style.width = `${Math.min((consumedFat / STATE.macroTargets.fat) * 100, 100)}%`;
    }

    function renderDiary() {
        const container = document.getElementById('diarySections');
        container.innerHTML = '';
        const dailyEntries = STATE.entries.filter(e => e.date === STATE.currentDate);

        categories.forEach(category => {
            const categoryEntries = dailyEntries.filter(e => e.category === category);
            const categoryCals = categoryEntries.reduce((sum, e) => sum + (e.calories || 0), 0);

            let listHTML = `<ul class="divide-y divide-gray-100">`;
            if (categoryEntries.length === 0) {
                listHTML += `<li class="p-4 text-center text-sm text-gray-400 italic">No entries</li>`;
            } else {
                categoryEntries.forEach(entry => {
                    let displayUnit = entry.unit === 'g' ? 'grams' : entry.unit === 'oz' ? 'oz' : entry.unit === 'ml' ? 'ml' : 'servings';
                    listHTML += `
                        <li class="p-3 flex justify-between items-center hover:bg-gray-50 transition" onclick="editEntry(${entry.id})">
                            <div class="flex-1 min-w-0 pr-4 cursor-pointer">
                                <p class="text-sm font-medium text-gray-800 truncate">${entry.name}</p>
                                <p class="text-[11px] text-gray-500 mt-0.5">
                                    ${entry.quantity} ${displayUnit} • C: ${entry.carbs}g | P: ${entry.protein}g | F: ${entry.fat}g
                                </p>
                            </div>
                            <div class="text-sm font-semibold text-gray-700">${entry.calories} kcal</div>
                        </li>
                    `;
                });
            }
            listHTML += `</ul>`;

            container.innerHTML += `
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden mb-4">
                    <div class="bg-gray-50 p-3 border-b flex justify-between items-center">
                        <h3 class="font-bold text-gray-800 text-sm">${category}</h3>
                        <span class="text-sm font-bold text-blue-600">${categoryCals} kcal</span>
                    </div>
                    ${listHTML}
                    <div class="p-2 bg-gray-50/50 border-t">
                        <button onclick="openAddModal('${category}')" class="w-full py-2 text-sm text-blue-600 font-medium hover:bg-blue-50 rounded-lg transition">
                            <i class="fas fa-plus mr-1"></i> Add Food
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function openAddModal(category) {
        editingEntryId = null;
        document.getElementById('entryCategory').value = category;
        document.getElementById('modalTitle').textContent = `Add to ${category}`;
        document.getElementById('addForm').reset();
        document.getElementById('entryQuantity').value = 1;
        document.getElementById('entryUnit').value = 'serving';
        
        foodContext = { calPerGram: 0, carbPerGram: 0, proPerGram: 0, fatPerGram: 0, servingWeightGrams: 100 };
        
        document.getElementById('searchScanTools').classList.remove('hidden');
        document.getElementById('deleteEntryBtn').classList.add('hidden');
        document.getElementById('modalOverlay').classList.remove('hidden');
        document.getElementById('addModal').classList.remove('translate-y-full');
    }

    function editEntry(id) {
        const entry = STATE.entries.find(e => e.id === id);
        if(!entry) return;
        editingEntryId = id;
        document.getElementById('entryCategory').value = entry.category;
        document.getElementById('modalTitle').textContent = `Edit Entry`;
        
        document.getElementById('entryName').value = entry.name;
        document.getElementById('entryQuantity').value = entry.quantity || 1;
        document.getElementById('entryUnit').value = entry.unit || 'serving';
        document.getElementById('entryCalories').value = entry.calories;
        document.getElementById('entryCarbs').value = entry.carbs;
        document.getElementById('entryProtein').value = entry.protein;
        document.getElementById('entryFat').value = entry.fat;

        foodContext.servingWeightGrams = entry.servingWeightGrams || 100;
        updateContextFromInputs(); 

        document.getElementById('searchScanTools').classList.add('hidden');
        document.getElementById('deleteEntryBtn').classList.remove('hidden');
        document.getElementById('modalOverlay').classList.remove('hidden');
        document.getElementById('addModal').classList.remove('translate-y-full');
    }

    function closeModal() {
        document.getElementById('addModal').classList.add('translate-y-full');
        setTimeout(() => {
            document.getElementById('modalOverlay').classList.add('hidden');
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchInput').value = '';
        }, 300);
    }

    function saveEntry(e) {
        e.preventDefault();
        const entryData = {
            category: document.getElementById('entryCategory').value,
            name: document.getElementById('entryName').value,
            quantity: parseFloat(document.getElementById('entryQuantity').value) || 1,
            unit: document.getElementById('entryUnit').value,
            servingWeightGrams: foodContext.servingWeightGrams || 100,
            calories: parseInt(document.getElementById('entryCalories').value) || 0,
            carbs: parseInt(document.getElementById('entryCarbs').value) || 0,
            protein: parseInt(document.getElementById('entryProtein').value) || 0,
            fat: parseInt(document.getElementById('entryFat').value) || 0,
            date: STATE.currentDate
        };

        if (editingEntryId) {
            const index = STATE.entries.findIndex(e => e.id === editingEntryId);
            STATE.entries[index] = { ...STATE.entries[index], ...entryData };
        } else {
            STATE.entries.push({ id: Date.now(), type: 'food', ...entryData });
        }

        closeModal();
        updateDashboard();
        renderDiary();
    }

    function deleteCurrentEntry() {
        if(editingEntryId) {
            STATE.entries = STATE.entries.filter(e => e.id !== editingEntryId);
            closeModal();
            updateDashboard();
            renderDiary();
        }
    }

    async function searchDatabase(e) {
        e.preventDefault();
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '<div class="p-4 text-center text-gray-500 text-sm"><i class="fas fa-spinner fa-spin mr-2"></i>Searching Open Food Facts...</div>';
        resultsContainer.classList.remove('hidden');

        try {
            const offRes = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=5`);
            const offData = await offRes.json();

            if (offData.products && offData.products.length > 0) {
                renderSearchResults(offData.products, 'off');
                return;
            }

            resultsContainer.innerHTML = '<div class="p-4 text-center text-gray-500 text-sm"><i class="fas fa-spinner fa-spin mr-2"></i>Searching USDA...</div>';
            const usdaRes = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(query)}&pageSize=5&api_key=DEMO_KEY`);
            const usdaData = await usdaRes.json();
            
            if (usdaData.foods && usdaData.foods.length > 0) {
                renderSearchResults(usdaData.foods, 'usda');
            } else {
                resultsContainer.innerHTML = '<div class="p-4 text-center text-gray-500 text-sm">No exact matches. Try a simpler word!</div>';
            }
        } catch (error) {
            resultsContainer.innerHTML = '<div class="p-4 text-center text-red-500 text-sm">Network error. Please enter manually.</div>';
        }
    }

    function renderSearchResults(products, source) {
        const resultsContainer = document.getElementById('searchResults');
        resultsContainer.innerHTML = '';
        
        products.forEach(product => {
            let name, cals, carbs, pro, fat, servingQty;

            if (source === 'off') {
                const n = product.nutriments || {};
                name = product.product_name || 'Unknown Food';
                cals = n['energy-kcal_100g'] || 0;
                carbs = n['carbohydrates_100g'] || 0;
                pro = n['proteins_100g'] || 0;
                fat = n['fat_100g'] || 0;
                servingQty = parseFloat(product.serving_quantity) || 100;
            } else {
                name = product.description;
                const getNutrient = (id) => { const nut = product.foodNutrients.find(n => n.nutrientId === id); return nut ? nut.value : 0; };
                cals = getNutrient(1008);
                carbs = getNutrient(1005);
                pro = getNutrient(1003);
                fat = getNutrient(1004);
                servingQty = product.servingSize || 100;
            }

            const div = document.createElement('div');
            div.className = 'p-3 hover:bg-blue-50 flex justify-between items-center cursor-pointer transition';
            div.innerHTML = `
                <div class="pr-2 truncate">
                    <div class="text-sm font-bold text-gray-800 truncate">${name}</div>
                    <div class="text-[11px] text-gray-500">Standard serving: ${Math.round(cals)} kcal</div>
                </div>
                <button class="bg-blue-100 text-blue-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-blue-200 shrink-0"><i class="fas fa-plus"></i></button>
            `;
            
            div.onclick = () => {
                foodContext = {
                    calPerGram: cals / 100, carbPerGram: carbs / 100, proPerGram: pro / 100, fatPerGram: fat / 100, servingWeightGrams: servingQty
                };
                document.getElementById('entryName').value = name;
                document.getElementById('entryUnit').value = 'serving';
                document.getElementById('entryQuantity').value = 1;
                calculateMacrosFromContext();

                resultsContainer.classList.add('hidden');
                document.getElementById('searchInput').value = '';
            };
            resultsContainer.appendChild(div);
        });
    }

    async function analyzePhoto(event) {
        if (!STATE.apiKey) {
            alert("Please save your Gemini API Key in the Progress & Goals tab first!");
            return;
        }

        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('aiLoading').classList.remove('hidden');

        try {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                const prompt = `Analyze this food image. Provide a JSON response (no markdown or extra text) estimating the nutritional value for the ENTIRE visible portion. Format exactly like this: {"name": "Food Name", "calories": 500, "carbs": 50, "protein": 30, "fat": 20, "weight_grams": 300}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${STATE.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: file.type, data: base64Data } }] }]
                    })
                });

                const result = await response.json();
                document.getElementById('aiLoading').classList.add('hidden');
                
                if (result.candidates && result.candidates.length > 0) {
                    let jsonText = result.candidates[0].content.parts[0].text;
                    jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const data = JSON.parse(jsonText);
                    
                    const totalGrams = data.weight_grams || 250;
                    foodContext = { 
                        calPerGram: data.calories / totalGrams, carbPerGram: data.carbs / totalGrams, proPerGram: data.protein / totalGrams, fatPerGram: data.fat / totalGrams, servingWeightGrams: totalGrams 
                    };

                    document.getElementById('entryName').value = data.name + " (AI Est.)";
                    document.getElementById('entryQuantity').value = 1;
                    document.getElementById('entryUnit').value = 'serving';
                    calculateMacrosFromContext();
                } else {
                    alert("AI could not analyze the image.");
                }
            };
        } catch (error) {
            document.getElementById('aiLoading').classList.add('hidden');
            alert("Error connecting to AI.");
        }
    }

    function saveApiKey() {
        STATE.apiKey = document.getElementById('profileApiKey').value;
        localStorage.setItem('geminiApiKey', STATE.apiKey);
        alert("API Key saved securely!");
    }

    function updateGoals() {
        STATE.goal = parseInt(document.getElementById('profileCalories').value) || 2000;
        STATE.macroTargets.carbs = parseInt(document.getElementById('profileCarbs').value) || 250;
        STATE.macroTargets.protein = parseInt(document.getElementById('profileProtein').value) || 150;
        STATE.macroTargets.fat = parseInt(document.getElementById('profileFat').value) || 65;
        updateDashboard();
        updateChart();
    }

    function initChart() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        progressChart = new Chart(ctx, {
            type: 'line',
            data: { labels: [], datasets: [] },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, suggestedMax: 2500 } },
                plugins: { legend: { display: false } }
            }
        });
        updateChart();
    }

    function updateChart() {
        if(!progressChart) return;
        
        let days = parseInt(document.getElementById('chartTimeframe').value) || 7;
        let labels = [];
        let dataPoints = [];
        let dateObj = new Date(getTodayString() + 'T00:00:00');
        
        for(let i=days-1; i>=0; i--) {
            let d = new Date(dateObj);
            d.setDate(d.getDate() - i);
            let dateStr = d.toISOString().split('T')[0];
            
            labels.push(d.toLocaleDateString(undefined, { weekday: 'short' }));
            let dailyTotal = STATE.entries.filter(e => e.date === dateStr).reduce((sum, e) => sum + (e.calories || 0), 0);
            dataPoints.push(dailyTotal);
        }

        progressChart.data.labels = labels;
        progressChart.data.datasets = [{
            label: 'Calories', data: dataPoints,
            borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)',
            borderWidth: 2, tension: 0.3, fill: true, pointRadius: 3
        }, {
            label: 'Goal', data: Array(days).fill(STATE.goal),
            borderColor: '#9ca3af', borderWidth: 2, borderDash: [5, 5], pointRadius: 0
        }];
        progressChart.update();
    }
</script>
