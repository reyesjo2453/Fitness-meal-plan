<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/2563eb/ffffff?text=FT">
    <title>FitTrack - Diet & Exercise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        
        /* Modal Animation */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 300ms, transform 300ms;
        }
    </style>
</head>
<body class="text-gray-800 antialiased">

<div class="max-w-md mx-auto bg-white min-h-screen shadow-2xl relative flex flex-col overflow-hidden">
    
    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold tracking-tight"><i class="fa-solid fa-leaf mr-2"></i>FitTrack</h1>
            <button class="text-white hover:text-gray-200 transition">
                <i class="fa-solid fa-user-circle text-2xl"></i>
            </button>
        </div>
        <div class="flex justify-between items-center text-sm font-medium border-t border-blue-500 pt-2 mt-2">
            <button id="prevDayBtn" onclick="changeDate(-1)" class="p-1 hover:bg-blue-700 rounded transition"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="currentDateDisplay">Today</span>
            <button id="nextDayBtn" onclick="changeDate(1)" class="p-1 hover:bg-blue-700 rounded opacity-50 cursor-not-allowed transition"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto pb-6 relative">
        <!-- Diary View -->
        <div id="diaryView" class="min-h-full bg-gray-50 flex flex-col">
            <!-- Calorie Summary Card (Moved back to Diary tab) -->
            <section class="p-4 bg-white border-b border-gray-100">
                <div class="flex items-center justify-between">
                    <!-- Equation Side -->
                    <div class="flex-1">
                        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Calories Remaining</h2>
                        <div class="flex items-center justify-between text-center max-w-[150px]">
                            <div>
                                <p class="text-lg font-bold text-gray-700" id="ui-goal">2000</p>
                                <p class="text-[10px] text-gray-500 font-medium">Goal</p>
                            </div>
                            <span class="text-gray-400 font-bold">-</span>
                            <div>
                                <p class="text-lg font-bold text-blue-600" id="ui-food">0</p>
                                <p class="text-[10px] text-gray-500 font-medium">Food</p>
                            </div>
                        </div>
                    </div>

                    <!-- Circular Progress -->
                    <div class="relative w-24 h-24 flex items-center justify-center flex-shrink-0 ml-4">
                        <svg class="w-24 h-24 absolute top-0 left-0" viewBox="0 0 100 100">
                            <circle class="text-gray-100 stroke-current" stroke-width="8" cx="50" cy="50" r="40" fill="transparent"></circle>
                            <circle id="calorieRing" class="text-green-500 stroke-current progress-ring__circle" stroke-width="8" stroke-linecap="round" cx="50" cy="50" r="40" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="0"></circle>
                        </svg>
                        <div class="text-center z-10 flex flex-col items-center justify-center mt-1">
                            <span class="text-2xl font-bold text-gray-800 leading-none" id="ui-remaining">2000</span>
                            <span class="text-[10px] font-medium text-gray-500 uppercase">Remaining</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Macros Summary (Moved back to Diary tab) -->
            <section class="px-4 py-3 bg-gray-50 border-b border-gray-200">
                <div class="flex space-x-4">
                    <!-- Carbs -->
                    <div class="flex-1">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="font-medium text-gray-600">Carbs</span>
                            <span class="text-gray-500"><span id="ui-carbs">0</span>/250g</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div id="bar-carbs" class="bg-teal-400 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Protein -->
                    <div class="flex-1">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="font-medium text-gray-600">Protein</span>
                            <span class="text-gray-500"><span id="ui-protein">0</span>/150g</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div id="bar-protein" class="bg-purple-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Fat -->
                    <div class="flex-1">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="font-medium text-gray-600">Fat</span>
                            <span class="text-gray-500"><span id="ui-fat">0</span>/65g</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div id="bar-fat" class="bg-yellow-400 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Diary Sections -->
            <div class="p-3 space-y-4 flex-1" id="diaryContainer">
                <!-- Sections will be injected here by JS -->
            </div>
        </div>

        <!-- Profile / Dashboard View -->
        <div id="profileView" class="hidden bg-white min-h-full pb-8">
            <!-- Progress Chart Section -->
            <div class="p-5 border-b border-gray-200 bg-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Calorie History</h2>
                    <div class="flex bg-gray-200/80 rounded-lg p-1">
                        <button onclick="updateChart(7)" id="btn-7d" class="px-3 py-1 text-xs font-semibold rounded-md bg-white shadow-sm text-gray-800 transition">7 Days</button>
                        <button onclick="updateChart(14)" id="btn-14d" class="px-3 py-1 text-xs font-semibold rounded-md text-gray-500 hover:text-gray-800 transition">14 Days</button>
                    </div>
                </div>
                <div class="w-full h-48 relative">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
            
            <div class="p-5 space-y-6">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2">My Goals</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Daily Calorie Goal</label>
                        <input type="number" id="profileGoal" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    
                    <h3 class="font-bold text-gray-700 mt-6 pt-4 border-t">Macronutrient Goals (g)</h3>
                    
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Carbs</label>
                            <input type="number" id="profileCarbs" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-400">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Protein</label>
                            <input type="number" id="profileProtein" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fat</label>
                            <input type="number" id="profileFat" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-yellow-400">
                        </div>
                    </div>

                    <button onclick="saveProfile()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md mt-6">
                        <i class="fa-solid fa-floppy-disk mr-2"></i> Save Goals
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-white border-t border-gray-200 flex justify-around items-center p-3 sticky bottom-0 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button id="tabDiary" onclick="switchTab('diary')" class="flex flex-col items-center text-blue-600 transition">
            <i class="fa-solid fa-book-open text-xl mb-1"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Diary</span>
        </button>
        <button id="tabProfile" onclick="switchTab('profile')" class="flex flex-col items-center text-gray-400 hover:text-gray-600 transition">
            <i class="fa-solid fa-chart-line text-xl mb-1"></i>
            <span class="text-[10px] font-bold uppercase tracking-wider">Progress</span>
        </button>
    </nav>

    <!-- Add Item Modal -->
    <div id="addModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-40 hidden flex items-end sm:items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-md shadow-xl overflow-hidden transform transition-transform translate-y-full sm:translate-y-0" id="modalContent">
            
            <div class="flex justify-between items-center p-4 border-b border-gray-100">
                <h3 class="text-lg font-bold text-gray-800" id="modalTitle">Add Food</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <form id="addForm" class="p-4 space-y-4">
                <input type="hidden" id="entryCategory" value="">
                
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <button type="button" id="scanBarcodeBtn" onclick="startScanner()" class="w-full bg-gray-800 text-white font-medium py-2 rounded-lg hover:bg-gray-700 transition flex items-center justify-center">
                        <i class="fa-solid fa-barcode mr-2"></i> Scan Barcode
                    </button>
                    
                    <button type="button" id="snapPhotoBtn" onclick="triggerCamera()" class="w-full bg-purple-600 text-white font-medium py-2 rounded-lg hover:bg-purple-700 transition flex items-center justify-center">
                        <i class="fa-solid fa-camera mr-2"></i> Snap Meal
                    </button>
                    <!-- Hidden file input for capturing image -->
                    <input type="file" id="mealPhotoInput" accept="image/*" capture="environment" class="hidden" onchange="handleMealPhoto(event)">
                </div>

                <!-- NEW SEARCH SECTION -->
                <div id="textSearchContainer" class="mb-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Search Food Database</label>
                    <div class="flex space-x-2">
                        <input type="text" id="searchInput" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); performTextSearch(); }" placeholder="e.g., Apple, Chicken Breast" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button type="button" id="searchBtn" onclick="performTextSearch()" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg hover:bg-blue-200 transition font-medium">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>
                    <!-- Search Results List -->
                    <ul id="searchResults" class="mt-2 max-h-48 overflow-y-auto bg-white border border-gray-200 rounded-lg hidden shadow-sm divide-y divide-gray-100">
                    </ul>
                </div>

                <div class="relative flex py-2 items-center" id="scanDivider">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-medium uppercase">Or enter manually</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" id="entryName" required placeholder="e.g., Banana, Running" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Calories</label>
                    <input type="number" id="entryCalories" required min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div id="macroInputs" class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Carbs (g)</label>
                        <input type="number" id="entryCarbs" min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-400">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Protein (g)</label>
                        <input type="number" id="entryProtein" min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fat (g)</label>
                        <input type="number" id="entryFat" min="0" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg mt-4">
                    <i class="fa-solid fa-check mr-2"></i> Save Entry
                </button>
            </form>
        </div>
    </div>

    <!-- Barcode Scanner Modal -->
    <div id="scannerModal" class="fixed inset-0 bg-black bg-opacity-95 z-50 hidden flex-col items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-4 flex justify-between items-center border-b border-gray-200 bg-gray-50">
                <h3 class="font-bold text-gray-800">Scan Product Barcode</h3>
                <button onclick="closeScanner()" class="text-gray-500 hover:text-red-500 transition px-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-4 bg-black">
                <div id="reader" class="w-full rounded overflow-hidden"></div>
            </div>
            <div class="p-4 text-center text-sm text-gray-500 bg-gray-50">
                Align the barcode within the frame to scan.
            </div>
        </div>
    </div>

    <!-- Message Alert Modal -->
    <div id="messageModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-xl overflow-hidden text-center p-6">
            <div id="messageIcon" class="text-4xl mb-4 text-blue-500">
                <i class="fa-solid fa-circle-info"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-800 mb-2" id="messageTitle">Notice</h3>
            <p class="text-gray-600 mb-6" id="messageText">Something happened.</p>
            <button onclick="closeMessage()" class="w-full bg-gray-100 text-gray-800 font-bold py-2 rounded-lg hover:bg-gray-200 transition">
                OK
            </button>
        </div>
    </div>

</div>

<script>
    // --- State Management ---
    // In a real app, this would sync with a backend/Firebase.
    // We'll use a simple in-memory state pre-populated with some sample data.
    
    let viewDate = new Date();
    let editingEntryId = null;

    // Generate mock historical data for the chart to be visible immediately
    const generateMockHistory = () => {
        const history = [];
        const today = new Date();
        for(let i=1; i<=14; i++) {
            const pastDate = new Date(today);
            pastDate.setDate(today.getDate() - i);
            const dateStr = pastDate.toISOString().split('T')[0];
            // Random calories between 1600 and 2200 to make the graph interesting
            const cals = Math.floor(Math.random() * 600) + 1600;
            history.push({ id: 100+i, type: 'food', category: 'Dinner', name: 'Past Meal (Mock)', calories: cals, carbs: 200, protein: 100, fat: 50, date: dateStr });
        }
        return history;
    };

    const STATE = {
        goal: 2000,
        macroTargets: { carbs: 250, protein: 150, fat: 65 }, // in grams
        entries: [
            { id: 1, type: 'food', category: 'Breakfast', name: 'Oatmeal & Berries', calories: 320, carbs: 55, protein: 10, fat: 5, date: new Date().toISOString().split('T')[0] },
            { id: 2, type: 'food', category: 'Lunch', name: 'Chicken Salad', calories: 450, carbs: 20, protein: 45, fat: 18, date: new Date().toISOString().split('T')[0] },
            ...generateMockHistory()
        ]
    };

    const categories = [
        { id: 'Breakfast', icon: 'fa-sun', color: 'text-yellow-500' },
        { id: 'Lunch', icon: 'fa-hamburger', color: 'text-orange-500' },
        { id: 'Dinner', icon: 'fa-utensils', color: 'text-blue-500' },
        { id: 'Snacks', icon: 'fa-apple-whole', color: 'text-green-500' }
    ];

    // --- DOM Elements ---
    const els = {
        diaryContainer: document.getElementById('diaryContainer'),
        uiGoal: document.getElementById('ui-goal'),
        uiFood: document.getElementById('ui-food'),
        uiRemaining: document.getElementById('ui-remaining'),
        calorieRing: document.getElementById('calorieRing'),
        uiCarbs: document.getElementById('ui-carbs'),
        uiProtein: document.getElementById('ui-protein'),
        uiFat: document.getElementById('ui-fat'),
        barCarbs: document.getElementById('bar-carbs'),
        barProtein: document.getElementById('bar-protein'),
        barFat: document.getElementById('bar-fat'),
        modal: document.getElementById('addModal'),
        modalContent: document.getElementById('modalContent'),
        modalTitle: document.getElementById('modalTitle'),
        addForm: document.getElementById('addForm'),
        macroInputs: document.getElementById('macroInputs'),
        entryCategory: document.getElementById('entryCategory'),
        scanBarcodeBtn: document.getElementById('scanBarcodeBtn'),
        scanDivider: document.getElementById('scanDivider'),
        scannerModal: document.getElementById('scannerModal'),
        messageModal: document.getElementById('messageModal'),
        messageTitle: document.getElementById('messageTitle'),
        messageText: document.getElementById('messageText'),
        searchInput: document.getElementById('searchInput'),
        searchBtn: document.getElementById('searchBtn'),
        searchResults: document.getElementById('searchResults'),
        textSearchContainer: document.getElementById('textSearchContainer'),
        
        // New Nav and View Elements
        prevDayBtn: document.getElementById('prevDayBtn'),
        nextDayBtn: document.getElementById('nextDayBtn'),
        currentDateDisplay: document.getElementById('currentDateDisplay'),
        diaryView: document.getElementById('diaryView'),
        profileView: document.getElementById('profileView'),
        tabDiary: document.getElementById('tabDiary'),
        tabProfile: document.getElementById('tabProfile'),
        profileGoal: document.getElementById('profileGoal'),
        profileCarbs: document.getElementById('profileCarbs'),
        profileProtein: document.getElementById('profileProtein'),
        profileFat: document.getElementById('profileFat'),
        snapPhotoBtn: document.getElementById('snapPhotoBtn')
    };

    let html5QrCode = null;
    let progressChart = null;
    let currentChartDays = 7;

    // --- Chart Logic ---
    function initChart() {
        const ctx = document.getElementById('progressChart').getContext('2d');
        
        progressChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Calories Consumed',
                    data: [],
                    borderColor: '#2563eb', // Tailwind blue-600
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#2563eb',
                    pointRadius: 4
                },
                {
                    label: 'Calorie Goal',
                    data: [],
                    borderColor: '#9ca3af', // Tailwind gray-400
                    borderWidth: 1.5,
                    borderDash: [5, 5],
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y + ' kcal';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: '#f3f4f6' },
                        ticks: { maxTicksLimit: 5 }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
        
        updateChart(7);
    }

    function updateChart(days) {
        currentChartDays = days;
        
        // Update UI buttons
        document.getElementById('btn-7d').className = days === 7 
            ? "px-3 py-1 text-xs font-semibold rounded-md bg-white shadow-sm text-gray-800 transition"
            : "px-3 py-1 text-xs font-semibold rounded-md text-gray-500 hover:text-gray-800 transition";
        document.getElementById('btn-14d').className = days === 14 
            ? "px-3 py-1 text-xs font-semibold rounded-md bg-white shadow-sm text-gray-800 transition"
            : "px-3 py-1 text-xs font-semibold rounded-md text-gray-500 hover:text-gray-800 transition";

        const labels = [];
        const data = [];
        const goals = [];
        
        // Calculate totals for the last 'days' (Chronological order)
        const today = new Date();
        for(let i = days - 1; i >= 0; i--) {
            const targetDate = new Date(today);
            targetDate.setDate(today.getDate() - i);
            const dateString = targetDate.toISOString().split('T')[0];
            
            // Format label as MM/DD
            labels.push(`${targetDate.getMonth()+1}/${targetDate.getDate()}`);
            
            // Sum calories for this date
            const dayCalories = STATE.entries
                .filter(e => e.type === 'food' && e.date === dateString)
                .reduce((sum, e) => sum + e.calories, 0);
                
            data.push(dayCalories);
            goals.push(STATE.goal);
        }
        
        progressChart.data.labels = labels;
        progressChart.data.datasets[0].data = data;
        progressChart.data.datasets[1].data = goals;
        progressChart.update();
    }

    // --- Utility: Custom Alert Box ---
    function showMessage(title, text, isError = false) {
        els.messageTitle.textContent = title;
        els.messageText.textContent = text;
        const iconContainer = document.getElementById('messageIcon');
        
        if (isError) {
            iconContainer.className = 'text-4xl mb-4 text-red-500';
            iconContainer.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
        } else {
            iconContainer.className = 'text-4xl mb-4 text-blue-500';
            iconContainer.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
        }
        
        els.messageModal.classList.remove('hidden');
    }

    function closeMessage() {

    function startScanner() {
        els.scannerModal.classList.remove('hidden');
        els.scannerModal.classList.add('flex');
        
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 150 } };
        
        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess,
            onScanFailure
        ).catch(err => {
            closeScanner();
            showMessage("Camera Access Denied", "Please allow camera access to scan barcodes.", true);
            console.error("Camera error:", err);
        });

    function closeScanner() {
        els.scannerModal.classList.add('hidden');
        els.scannerModal.classList.remove('flex');
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(ignore => {
                // Scanner stopped successfully
            }).catch(err => {
                console.error("Failed to stop scanner:", err);
            });
        }

        closeScanner();

        fetchNutritionData(decodedText);

    async function fetchNutritionData(barcode) {
        try {
            const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
            const data = await response.json();

            if (data.status === 1 && data.product) {
                const product = data.product;
                const nutriments = product.nutriments || {};
                
                // Usually represented per 100g, we'll extract these values.
                const name = product.product_name || "Unknown Product";
                const calories = nutriments['energy-kcal_100g'] || nutriments['energy-kcal'] || 0;
                const carbs = nutriments['carbohydrates_100g'] || nutriments['carbohydrates'] || 0;
                const protein = nutriments['proteins_100g'] || nutriments['proteins'] || 0;
                const fat = nutriments['fat_100g'] || nutriments['fat'] || 0;

                // Auto-fill the form
                document.getElementById('entryName').value = `${name} (100g)`;
                document.getElementById('entryCalories').value = Math.round(calories);
                document.getElementById('entryCarbs').value = Math.round(carbs);
                document.getElementById('entryProtein').value = Math.round(protein);
                document.getElementById('entryFat').value = Math.round(fat);
                
                showMessage("Success", `Found nutritional data for ${name}.`);
            } else {
                document.getElementById('entryName').value = "";
                showMessage("Not Found", "Sorry, we couldn't find this product in the open database. Please enter manually.", true);
            }
        } catch (error) {
            document.getElementById('entryName').value = "";
            showMessage("Network Error", "Could not connect to the nutrition database. Check your internet connection.", true);
            console.error(error);
        }
    }

    // --- Text Search Logic ---
    async function performTextSearch(isFallback = false, fallbackQuery = "") {
        const originalQuery = els.searchInput.value.trim();
        const query = isFallback ? fallbackQuery : originalQuery;
        
        if (!query) {
            showMessage("Notice", "Please enter a food item to search.");
            return;
        }

        // Only show loading state if it's the first search attempt
        if (!isFallback) {
            els.searchBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            els.searchBtn.disabled = true;
            els.searchResults.innerHTML = '';
            els.searchResults.classList.add('hidden');
        }

        try {
            let products = [];
            
            // 1. Try Open Food Facts (Primary Database)
            try {
                // Using 'us' subdomain as it is often more stable for search queries
                const offResponse = await fetch(`https://us.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=15`);
                if (offResponse.ok) {
                    const offData = await offResponse.json();
                    if (offData.products && offData.products.length > 0) {
                        products = offData.products;
                    }
                }
            } catch (offError) {
                console.warn("Primary database search failed, falling back to USDA:", offError);
            }

            // 2. Fallback to USDA FoodData Central if primary fails or finds nothing
            if (products.length === 0) {
                try {
                    const usdaResponse = await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?query=${encodeURIComponent(query)}&api_key=DEMO_KEY&pageSize=15`);
                    if (usdaResponse.ok) {
                        const usdaData = await usdaResponse.json();
                        if (usdaData.foods && usdaData.foods.length > 0) {
                            // Map USDA data to match our existing UI structure
                            products = usdaData.foods.map(food => {
                                let calories = 0, carbs = 0, protein = 0, fat = 0;
                                food.foodNutrients.forEach(n => {
                                    if (n.nutrientName === "Energy" && n.unitName === "KCAL") calories = n.value;
                                    else if (n.nutrientName.includes("Carbohydrate")) carbs = n.value;
                                    else if (n.nutrientName === "Protein") protein = n.value;
                                    else if (n.nutrientName.includes("lipid (fat)")) fat = n.value;
                                });
                                return {
                                    product_name: food.description,
                                    brands: food.brandOwner || "USDA Database",
                                    nutriments: {
                                        'energy-kcal_100g': calories,
                                        'carbohydrates_100g': carbs,
                                        'proteins_100g': protein,
                                        'fat_100g': fat
                                    }
                                };
                            });
                        }
                    }
                } catch (usdaError) {
                    console.warn("USDA search failed:", usdaError);
                }
            }

            // 3. Display Results or try a shorter query
            if (products.length > 0) {
                els.searchResults.innerHTML = '';
                els.searchResults.classList.remove('hidden');
                
                // If this was a fallback search, add a notice at the top
                if (isFallback) {
                    const noticeLi = document.createElement('li');
                    noticeLi.className = "p-2 bg-yellow-50 text-yellow-800 text-xs font-medium text-center border-b border-yellow-200";
                    noticeLi.textContent = `No exact match for "${originalQuery}". Showing broader results for "${query}":`;
                    els.searchResults.appendChild(noticeLi);
                }

                products.forEach(product => {
                    // Skip if product name is missing
                    if (!product.product_name) return;
                    
                    const li = document.createElement('li');
                    li.className = "p-3 hover:bg-blue-50 cursor-pointer text-sm flex justify-between items-center transition-colors";
                    
                    const brand = product.brands ? `<span class="text-xs text-gray-500 block truncate max-w-[200px]">${product.brands.split(',')[0]}</span>` : '';
                    
                    li.innerHTML = `
                        <div class="truncate pr-2 flex-1">
                            <span class="font-medium text-gray-800">${product.product_name}</span>
                            ${brand}
                        </div>
                        <button type="button" class="text-blue-600 bg-blue-100 px-3 py-1.5 rounded-md text-xs font-bold hover:bg-blue-200 transition flex-shrink-0">Add</button>
                    `;
                    
                    // Assign click event to populate form
                    li.onclick = () => selectSearchResult(product);
                    els.searchResults.appendChild(li);
                });
            } else {
                // If both databases fail and the query has multiple words, try removing the last word
                const words = originalQuery.split(/\s+/); 
                if (!isFallback && words.length > 1) {
                    const shorterQuery = words.slice(0, words.length - 1).join(' ');
                    // Wait for the fallback to finish so the finally block doesn't run early
                    await performTextSearch(true, shorterQuery);
                    return; 
                }

                // If all fallbacks are exhausted
                showMessage("Not Found", `We couldn't find "${query}" in our databases.\n\nTip: Try searching for fewer words, or use the Snap Meal AI feature instead!`);
            }
        } catch (error) {
            showMessage("Search Error", "Both databases are currently unreachable. Please check your internet connection.", true);
            console.error(error);
        } finally {
            // Only reset the button if this is the original execution thread
            if (!isFallback) {
                els.searchBtn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i>';
                els.searchBtn.disabled = false;
            }
        }
    }

    function selectSearchResult(product) {
        const nutriments = product.nutriments || {};
        const name = product.product_name || "Unknown Product";
        
        // Prefer per-serving values if available, fallback to 100g standard, then default to 0
        const calories = nutriments['energy-kcal_serving'] || nutriments['energy-kcal_100g'] || nutriments['energy-kcal'] || 0;
        const carbs = nutriments['carbohydrates_serving'] || nutriments['carbohydrates_100g'] || nutriments['carbohydrates'] || 0;
        const protein = nutriments['proteins_serving'] || nutriments['proteins_100g'] || nutriments['proteins'] || 0;
        const fat = nutriments['fat_serving'] || nutriments['fat_100g'] || nutriments['fat'] || 0;

        // Try to append serving size to name for clarity
        const portionInfo = (nutriments['energy-kcal_serving'] ? (product.serving_size ? ` (${product.serving_size})` : ' (serving)') : ' (100g)');

        // Fill form fields
        const inputs = {
            'entryName': `${name}${portionInfo}`,
            'entryCalories': Math.round(calories),
            'entryCarbs': Math.round(carbs),
            'entryProtein': Math.round(protein),
            'entryFat': Math.round(fat)
        };

        for (const [id, value] of Object.entries(inputs)) {
            const el = document.getElementById(id);
            el.value = value;
            
            // Visual feedback flash
            el.classList.add('bg-green-50', 'ring-2', 'ring-green-400');
            setTimeout(() => el.classList.remove('bg-green-50', 'ring-2', 'ring-green-400'), 800);
        }

        // Hide search results and clear input to clean up the UI
        els.searchResults.classList.add('hidden');
        els.searchResults.innerHTML = '';
        els.searchInput.value = '';
    }

    function calculateTotals() {
        let totalFood = 0;
        let totalCarbs = 0;
        let totalProtein = 0;
        let totalFat = 0;

        const dateString = viewDate.toISOString().split('T')[0];

        STATE.entries.forEach(entry => {
            if (entry.type === 'food' && entry.date === dateString) {
                totalFood += entry.calories;
                totalCarbs += entry.carbs || 0;
                totalProtein += entry.protein || 0;
                totalFat += entry.fat || 0;
            }
        });

        const remaining = STATE.goal - totalFood;

        return { totalFood, remaining, totalCarbs, totalProtein, totalFat };
    }

    function updateDashboard() {
        const totals = calculateTotals();

        // Update Text
        els.uiGoal.textContent = STATE.goal;
        els.uiFood.textContent = totals.totalFood;
        els.uiRemaining.textContent = totals.remaining;
        
        // Color code remaining based on goal status
        if (totals.remaining < 0) {
            els.uiRemaining.classList.replace('text-gray-800', 'text-red-500');
            els.calorieRing.classList.replace('text-green-500', 'text-red-500');
        } else {
            els.uiRemaining.classList.replace('text-red-500', 'text-gray-800');
            els.calorieRing.classList.replace('text-red-500', 'text-green-500');
        }

        // Update Ring (Circumference of r=40 is approx 251.2)
        const circumference = 251.2;
        let percent = totals.totalFood / STATE.goal;
        // Clamp between 0 and 1 for ring display
        percent = Math.max(0, Math.min(1, percent)); 
        const offset = circumference - percent * circumference;
        els.calorieRing.style.strokeDashoffset = offset;

        // Update Macros Text
        els.uiCarbs.textContent = totals.totalCarbs;
        els.uiProtein.textContent = totals.totalProtein;
        els.uiFat.textContent = totals.totalFat;

        // Update Macros Bars
        const carbsPct = Math.min(100, (totals.totalCarbs / STATE.macroTargets.carbs) * 100);
        const proteinPct = Math.min(100, (totals.totalProtein / STATE.macroTargets.protein) * 100);
        const fatPct = Math.min(100, (totals.totalFat / STATE.macroTargets.fat) * 100);

        els.barCarbs.style.width = `${carbsPct}%`;
        els.barProtein.style.width = `${proteinPct}%`;
        els.barFat.style.width = `${fatPct}%`;
        
        if(progressChart) {
            updateChart(currentChartDays);
        }
    }

    async function handleMealPhoto(event) {
        const file = event.target.files[0];
        if (!file) return;

        // Visual feedback
        const snapBtn = document.getElementById('snapPhotoBtn');
        const originalBtnHTML = snapBtn.innerHTML;
        snapBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Analyzing AI...';
        snapBtn.disabled = true;

        try {
            const base64Data = await fileToBase64(file);
            await analyzeMealPhoto(base64Data, file.type);
        } catch (error) {
            console.error(error);
            showMessage("Analysis Failed", "Could not analyze the photo. Please try again or enter manually.", true);
        } finally {
            snapBtn.innerHTML = originalBtnHTML;
            snapBtn.disabled = false;
            // Reset input so the same file can be selected again if needed
            event.target.value = '';
        }
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function analyzeMealPhoto(base64String, mimeType) {
        const apiKey = ""; // API Key injected by environment
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        
        // Remove the data URL prefix (e.g., "data:image/jpeg;base64,")
        const base64Data = base64String.split(',')[1];

        const payload = {
            contents: [
                {
                    role: "user",
                    parts: [
                        { text: "Estimate the nutritional content of this meal. Provide a generic, concise name, and estimates for total calories, carbohydrates (g), protein (g), and fat (g)." },
                        {
                            inlineData: {
                                mimeType: mimeType,
                                data: base64Data
                            }
                        }
                    ]
                }
            ],
            generationConfig: {
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        name: { type: "STRING" },
                        calories: { type: "INTEGER" },
                        carbs: { type: "INTEGER" },
                        protein: { type: "INTEGER" },
                        fat: { type: "INTEGER" }
                    },
                    required: ["name", "calories", "carbs", "protein", "fat"]
                }
            }
        };

        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();
        
        if (result.candidates && result.candidates.length > 0) {
            const jsonText = result.candidates[0].content.parts[0].text;
            const data = JSON.parse(jsonText);
            
            // Populate form
            const inputs = {
                'entryName': data.name + " (AI Estimate)",
                'entryCalories': data.calories,
                'entryCarbs': data.carbs,
                'entryProtein': data.protein,
                'entryFat': data.fat
            };

            for (const [id, value] of Object.entries(inputs)) {
                const el = document.getElementById(id);
                el.value = value;
                // Visual feedback flash
                el.classList.add('bg-purple-50', 'ring-2', 'ring-purple-400');
                setTimeout(() => el.classList.remove('bg-purple-50', 'ring-2', 'ring-purple-400'), 1500);
            }
            showMessage("AI Analysis Complete", "We've estimated the macros for your meal. Please review and adjust if needed before saving.");
        } else {
            throw new Error("Invalid response from AI");
        }
    }

                { src: "https://placehold.co/192x192/2563eb/ffffff?text=FT", sizes: "192x192", type: "image/png" },
                { src: "https://placehold.co/512x512/2563eb/ffffff?text=FT", sizes: "512x512", type: "image/png" }
            ],
            start_url: "."
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);

        // 2. Inject Service Worker (Required for Android install prompt)
        const swCode = `
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
            self.addEventListener('fetch', (e) => { 
                e.respondWith(fetch(e.request).catch(() => new Response('Offline'))); 
            });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(swBlob);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl).catch(console.error);
        }
    }

</script>
</body>
